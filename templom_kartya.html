<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Templomi ülésfoglaló kártyagenerátor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        html, body { margin: 0; padding: 0; background-color: #f5f5f4; }
        body { 
            font-family: 'Cormorant Garamond', serif; 
            -webkit-print-color-adjust: exact !important; 
            print-color-adjust: exact !important; 
        }
        .wedding-title { font-family: 'Playfair Display', serif; }
        
        .print-page-landscape {
            width: 297mm;
            height: 210mm;
            background: white;
            position: relative;
            box-sizing: border-box;
            margin: 0 auto;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
        }

        @media print {
            .no-print { display: none !important; }
            html, body { 
                background-color: white !important; 
                margin: 0 !important; 
                padding: 0 !important; 
            }
            .print-page-landscape {
                margin: 0 !important;
                box-shadow: none !important;
                width: 297mm !important;
                height: 210mm !important;
                page-break-after: always;
                break-after: page;
            }
            @page { 
                /* Teljesen kivettük a size paramétert, így a böngésző kötelezően engedi a kézi állítást! */
                margin: 0mm; 
            }
        }
    </style>
</head>
<body class="p-6 min-h-screen flex flex-col xl:flex-row gap-8 items-start justify-center">

    <style>
        body { padding-top: 100px !important; }
        @media print { body { padding-top: 0 !important; } }
    </style>

    <header class="no-print fixed top-0 left-0 w-full bg-white border-b border-stone-200 shadow-md z-[100]">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex flex-col md:flex-row justify-between items-center h-auto md:h-[72px] py-3 md:py-0">
                <a href="index.html" class="text-2xl font-bold text-[#D4AF37] tracking-wider mb-2 md:mb-0 hover:text-[#C5A028] transition-colors" style="font-family: 'Playfair Display', serif;">
                    Esküvői szervező
                </a>
                
                <div class="flex flex-wrap justify-center gap-2 sm:gap-4 md:space-x-8" id="main-nav-links">
                    <a href="szallas.html" class="nav-link text-stone-600 hover:text-[#D4AF37] text-xs sm:text-sm font-semibold font-sans uppercase tracking-widest transition-colors px-2 py-1">Szálláslista</a>
                    <a href="templom_kartya.html" class="nav-link text-stone-600 hover:text-[#D4AF37] text-xs sm:text-sm font-semibold font-sans uppercase tracking-widest transition-colors px-2 py-1">Templomi kártyák</a>
                    <a href="ajto_kartya.html" class="nav-link text-stone-600 hover:text-[#D4AF37] text-xs sm:text-sm font-semibold font-sans uppercase tracking-widest transition-colors px-2 py-1">Ajtótáblák</a>
                </div>
            </div>
        </div>
    </header>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const links = document.querySelectorAll('.nav-link');
            const currentUrl = window.location.pathname.split('/').pop() || 'index.html';
            
            links.forEach(link => {
                if (link.getAttribute('href') === currentUrl) {
                    link.classList.remove('text-stone-600');
                    link.classList.add('text-[#D4AF37]', 'border-b-2', 'border-[#D4AF37]');
                }
            });
        });
    </script>

    <div class="no-print w-full xl:w-96 bg-white p-6 rounded-xl shadow-md border border-stone-200 sticky top-6 z-50 shrink-0">
        <h2 class="text-2xl font-bold mb-4 wedding-title text-stone-800">Kártya beállítások</h2>

        <div class="mb-4">
            <label class="block text-sm font-semibold mb-2 text-stone-600">Fő felirat</label>
            <input type="text" id="mainText" value="Örömszülők" class="w-full border border-stone-300 p-2 rounded focus:outline-none focus:ring-2 focus:ring-[#D4AF37] font-sans text-lg text-center">
        </div>

        <div class="mb-6">
            <label class="block text-sm font-semibold mb-2 text-stone-600">Kiegészítő szöveg</label>
            <textarea id="subText" rows="2" class="w-full border border-stone-300 p-2 rounded focus:outline-none focus:ring-2 focus:ring-[#D4AF37] font-sans text-center">Kérjük, hagyja üresen az egész sort!</textarea>
        </div>

        <div class="mb-6 bg-stone-50 p-4 rounded-lg border border-stone-200">
            <h3 class="text-sm font-bold text-stone-700 mb-4 font-sans uppercase tracking-wider">Betűméretek</h3>
            
            <div class="mb-4">
                <div class="flex justify-between text-xs font-semibold text-stone-600 mb-1 font-sans">
                    <label for="mainSize">Fő felirat</label>
                    <span id="mainSizeVal">100 px</span>
                </div>
                <input type="range" id="mainSize" min="50" max="180" value="100" class="w-full accent-[#D4AF37] cursor-pointer">
            </div>

            <div>
                <div class="flex justify-between text-xs font-semibold text-stone-600 mb-1 font-sans">
                    <label for="subSize">Kiegészítő szöveg</label>
                    <span id="subSizeVal">35 px</span>
                </div>
                <input type="range" id="subSize" min="20" max="80" value="35" class="w-full accent-[#D4AF37] cursor-pointer">
            </div>
        </div>

        <button onclick="window.print()" class="w-full bg-[#D4AF37] hover:bg-[#C5A028] text-white font-bold py-4 px-4 rounded-lg transition duration-200 font-sans tracking-wide shadow-sm flex items-center justify-center gap-2 text-lg">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" /></svg>
            Nyomtatás / PDF mentés
        </button>
        <p class="text-xs text-stone-400 mt-4 text-center font-sans">Fontos: Nyomtatásnál a tájolást állítsd <strong>Fekvőre</strong>, a margót pedig <strong>Nincs</strong>-re!</p>
    </div>

    <div class="print-page-landscape flex flex-col items-center justify-center p-12">
        <div class="absolute top-[12mm] left-[12mm] right-[12mm] bottom-[12mm] border border-[#D4AF37] opacity-40 pointer-events-none rounded-sm"></div>
        <div class="absolute top-[14mm] left-[14mm] right-[14mm] bottom-[14mm] border-2 border-[#D4AF37] pointer-events-none rounded-sm"></div>
        
        <div class="relative z-10 w-full px-16 text-center flex flex-col items-center justify-center">
            <h1 id="displayMainText" class="font-bold wedding-title text-stone-800 tracking-wide mb-6 leading-tight">
                Örömszülők
            </h1>
            
            <div class="h-px bg-[#D4AF37] w-48 mx-auto mb-8 opacity-60"></div>
            
            <p id="displaySubText" class="italic text-stone-600 font-serif tracking-widest leading-snug">
                Kérjük, hagyja üresen az egész sort!
            </p>
        </div>
    </div>

    <script>
        const mainTextInput = document.getElementById('mainText');
        const subTextInput = document.getElementById('subText');
        const mainSizeSlider = document.getElementById('mainSize');
        const subSizeSlider = document.getElementById('subSize');
        
        const displayMainText = document.getElementById('displayMainText');
        const displaySubText = document.getElementById('displaySubText');
        const mainSizeVal = document.getElementById('mainSizeVal');
        const subSizeVal = document.getElementById('subSizeVal');

        function updateCard() {
            displayMainText.textContent = mainTextInput.value;
            displaySubText.innerHTML = subTextInput.value.replace(/\n/g, '<br>');

            const mSize = mainSizeSlider.value;
            const sSize = subSizeSlider.value;

            displayMainText.style.fontSize = mSize + 'px';
            displaySubText.style.fontSize = sSize + 'px';

            mainSizeVal.textContent = mSize + ' px';
            subSizeVal.textContent = sSize + ' px';
        }

        mainTextInput.addEventListener('input', updateCard);
        subTextInput.addEventListener('input', updateCard);
        mainSizeSlider.addEventListener('input', updateCard);
        subSizeSlider.addEventListener('input', updateCard);

        updateCard();
    </script>
</body>
</html>
