<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esküvői Szálláslista Generátor - Prémium V4 (Vonalak nélkül)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cormorant Garamond', serif; }
        .wedding-title { font-family: 'Playfair Display', serif; }
        
        /* Fix A4-es lapméretezés a képernyőn */
        .print-page {
            width: 210mm;
            height: 297mm;
            background: white;
            position: relative;
            box-sizing: border-box;
            padding: 25mm 20mm;
            margin: 0 auto 30px auto;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
        }

        /* Nyomtatási finomhangolás */
        @media print {
            .no-print { display: none !important; }
            body { background-color: white; margin: 0; padding: 0; }
            .print-page {
                margin: 0 !important;
                box-shadow: none !important;
                page-break-after: always;
                break-after: page;
            }
            /* Megakadályozza a legutolsó üres oldalt */
            .print-page:last-child {
                page-break-after: avoid;
                break-after: avoid;
            }
            @page { 
                size: A4; 
                margin: 0; 
            }
        }
    </style>
</head>
<body class="bg-stone-100 p-6 min-h-screen flex flex-col md:flex-row gap-8">

    <div class="no-print w-full md:w-80 bg-white p-6 rounded-xl shadow-md border border-stone-200 self-start sticky top-6 z-50">
        <h2 class="text-2xl font-bold mb-4 wedding-title text-stone-800">Lista beállítások</h2>

        <div class="mb-4">
            <label class="block text-sm font-semibold mb-2 text-stone-600">Épület neve</label>
            <input type="text" id="buildingTitle" value="Borostyán Ház" class="w-full border border-stone-300 p-2 rounded focus:outline-none focus:ring-2 focus:ring-stone-400 font-sans">
        </div>

        <div class="mb-4 bg-stone-50 p-3 rounded-lg border border-stone-200">
            <h3 class="text-sm font-bold text-stone-700 mb-3 font-sans uppercase tracking-wider">Betűméretek testreszabása</h3>
            
            <div class="mb-3">
                <div class="flex justify-between text-xs font-semibold text-stone-600 mb-1 font-sans">
                    <label for="titleSize">Cím mérete</label>
                    <span id="titleSizeVal">40 px</span>
                </div>
                <input type="range" id="titleSize" min="28" max="60" value="40" class="w-full accent-stone-700 cursor-pointer">
            </div>

            <div>
                <div class="flex justify-between text-xs font-semibold text-stone-600 mb-1 font-sans">
                    <label for="textSize">Vendéglista mérete</label>
                    <span id="textSizeVal">20 px</span>
                </div>
                <input type="range" id="textSize" min="14" max="28" value="20" class="w-full accent-stone-700 cursor-pointer">
            </div>
        </div>

        <div class="mb-6">
            <label class="block text-sm font-semibold mb-2 text-stone-600">Vendégek (Név; Szoba)</label>
            <textarea id="guestList" rows="12" class="w-full border border-stone-300 p-2 rounded text-sm focus:outline-none focus:ring-2 focus:ring-stone-400 font-sans" placeholder="Kovács János; 1. szoba"></textarea>
            <p class="text-xs text-stone-500 mt-2 font-sans">Válaszd el őket <strong>pontosvesszővel (;)</strong>.</p>
        </div>

        <button onclick="window.print()" class="w-full bg-stone-800 hover:bg-stone-900 text-white font-bold py-3 px-4 rounded-lg transition duration-200 font-sans tracking-wide shadow-sm flex items-center justify-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" /></svg>
            Nyomtatás / PDF
        </button>
    </div>

    <div id="pagesContainer" class="flex-1">
        </div>

    <script>
        const inputTitle = document.getElementById('buildingTitle');
        const guestList = document.getElementById('guestList');
        const titleSizeSlider = document.getElementById('titleSize');
        const textSizeSlider = document.getElementById('textSize');
        const titleSizeVal = document.getElementById('titleSizeVal');
        const textSizeVal = document.getElementById('textSizeVal');
        const pagesContainer = document.getElementById('pagesContainer');

        const ROWS_PER_PAGE = 15;

        function updateView() {
            const title = inputTitle.value;
            const tSize = titleSizeSlider.value;
            const nSize = textSizeSlider.value;

            // Csúszka értékek kiírása a vezérlőpultra
            titleSizeVal.textContent = tSize + ' px';
            textSizeVal.textContent = nSize + ' px';

            // Üres sorok kiszűrése
            const lines = guestList.value.split('\n').filter(line => line.trim() !== '');
            
            // Adatok objektummá alakítása
            const guests = lines.map(line => {
                const [name, room] = line.split(';');
                return { name: name?.trim() || '', room: room?.trim() || '' };
            });

            pagesContainer.innerHTML = '';

            const totalPages = Math.max(1, Math.ceil(guests.length / ROWS_PER_PAGE));

            for (let p = 0; p < totalPages; p++) {
                const pageDiv = document.createElement('div');
                pageDiv.className = 'print-page';

                pageDiv.innerHTML = `
                    <div class="absolute top-[12mm] left-[12mm] right-[12mm] bottom-[12mm] border border-stone-200 pointer-events-none rounded-sm"></div>
                    <div class="absolute top-[14mm] left-[14mm] right-[14mm] bottom-[14mm] border-2 border-stone-300 pointer-events-none rounded-sm"></div>
                    
                    <div class="text-center mb-8 relative z-10">
                        <h1 class="font-bold mb-2 wedding-title text-stone-800 tracking-wide" style="font-size: ${tSize}px; line-height: 1.2;">${title}</h1>
                        <p class="italic text-stone-500 font-serif tracking-wide" style="font-size: ${Math.max(16, tSize * 0.45)}px;">Szállásbeosztás</p>
                        <div class="h-px bg-stone-300 w-24 mx-auto mt-4"></div>
                    </div>

                    <div class="relative z-10 px-4">
                        <table class="w-full table-fixed text-left border-collapse">
                            <thead>
                                <tr class="border-b border-stone-300 text-stone-400 uppercase tracking-widest text-xs font-sans h-[10mm]">
                                    <th class="w-[10%] font-semibold pl-4">#</th>
                                    <th class="w-[55%] font-semibold">Vendég neve</th>
                                    <th class="w-[35%] font-semibold text-right pr-6">Szoba / Helyszín</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                    
                    <div class="absolute bottom-[18mm] left-0 right-0 text-center text-xs text-stone-400 font-sans tracking-widest uppercase">
                        ${p + 1} / ${totalPages} oldal
                    </div>
                `;

                const tbody = pageDiv.querySelector('tbody');

                for (let r = 0; r < ROWS_PER_PAGE; r++) {
                    const guestIndex = (p * ROWS_PER_PAGE) + r;
                    const guest = guests[guestIndex];
                    const tr = document.createElement('tr');
                    
                    // JAVÍTÁS: Eltávolítottuk a 'border-b border-stone-100' osztályokat
                    tr.className = "h-[13mm]";

                    if (guest) {
                        tr.innerHTML = `
                            <td class="text-stone-400 font-medium font-sans pl-4" style="font-size: ${Math.max(13, nSize * 0.75)}px;">${guestIndex + 1}.</td>
                            <td class="font-semibold text-stone-800 truncate pr-4" style="font-size: ${nSize}px;">${guest.name}</td>
                            <td class="text-right italic text-stone-600 truncate pr-6" style="font-size: ${nSize}px;">${guest.room}</td>
                        `;
                    } else {
                        tr.innerHTML = `
                            <td class="text-transparent font-sans pl-4" style="font-size: ${nSize}px;">${guestIndex + 1}.</td>
                            <td>&nbsp;</td>
                            <td>&nbsp;</td>
                        `;
                    }
                    tbody.appendChild(tr);
                }

                pagesContainer.appendChild(pageDiv);
            }
        }

        inputTitle.addEventListener('input', updateView);
        guestList.addEventListener('input', updateView);
        titleSizeSlider.addEventListener('input', updateView);
        textSizeSlider.addEventListener('input', updateView);

        const sampleGuests = [];
        for(let i = 1; i <= 20; i++) {
            sampleGuests.push(`Minta Vendégcsalád ${i}; ${i + 10}. apartman`);
        }
        guestList.value = sampleGuests.join('\n');
        updateView();
    </script>
</body>
</html>
