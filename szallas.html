<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esküvői Szálláslista Generátor - Prémium V9 (Titkos azonosítóval)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        html, body { margin: 0; padding: 0; }
        body { 
            font-family: 'Cormorant Garamond', serif; 
            -webkit-print-color-adjust: exact !important; 
            print-color-adjust: exact !important; 
        }
        .wedding-title { font-family: 'Playfair Display', serif; }
        
        .print-page {
            width: 210mm;
            height: 297mm;
            background: white;
            position: relative;
            box-sizing: border-box;
            padding: 25mm 20mm;
            margin: 0 auto 30px auto;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
        }

        @media print {
            .no-print { display: none !important; }
            html, body { 
                background-color: white !important; 
                margin: 0 !important; 
                padding: 0 !important; 
                width: 210mm; 
                height: 297mm;
            }
            .print-page {
                margin: 0 !important;
                padding: 25mm 20mm !important;
                box-shadow: none !important;
                width: 210mm !important;
                height: 297mm !important;
                page-break-after: always;
                break-after: page;
            }
            .print-page:last-child {
                page-break-after: auto;
                break-after: auto;
            }
            @page { 
                size: A4 portrait; 
                margin: 0mm; 
            }
        }
    </style>
</head>
<body class="bg-stone-100 p-6 min-h-screen flex flex-col md:flex-row gap-8">

    <style>
        body { padding-top: 100px !important; }
        @media print { body { padding-top: 0 !important; } }
    </style>

    <header class="no-print fixed top-0 left-0 w-full bg-white border-b border-stone-200 shadow-md z-[100]">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex flex-col md:flex-row justify-between items-center h-auto md:h-[72px] py-3 md:py-0">
                <!-- Logó / Vissza a főoldalra -->
                <a href="index.html" class="text-2xl font-bold text-[#D4AF37] tracking-wider mb-2 md:mb-0 hover:text-[#C5A028] transition-colors" style="font-family: 'Playfair Display', serif;">
                    Esküvői szervező
                </a>
                
                <!-- Menüpontok -->
                <div class="flex flex-wrap justify-center gap-2 sm:gap-4 md:space-x-8" id="main-nav-links">
                    <a href="szallas.html" class="nav-link text-stone-600 hover:text-[#D4AF37] text-xs sm:text-sm font-semibold font-sans uppercase tracking-widest transition-colors px-2 py-1">Szálláslista</a>
                    <a href="templom_kartya.html" class="nav-link text-stone-600 hover:text-[#D4AF37] text-xs sm:text-sm font-semibold font-sans uppercase tracking-widest transition-colors px-2 py-1">Templomi kártyák</a>
                    <a href="ajto_kartya.html" class="nav-link text-stone-600 hover:text-[#D4AF37] text-xs sm:text-sm font-semibold font-sans uppercase tracking-widest transition-colors px-2 py-1">Ajtótáblák</a>
                </div>
            </div>
        </div>
    </header>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const links = document.querySelectorAll('.nav-link');
            const currentUrl = window.location.pathname.split('/').pop() || 'index.html';
            
            links.forEach(link => {
                if (link.getAttribute('href') === currentUrl) {
                    link.classList.remove('text-stone-600');
                    link.classList.add('text-[#D4AF37]', 'border-b-2', 'border-[#D4AF37]');
                }
            });
        });
    </script>

    <div class="no-print w-full md:w-80 bg-white p-6 rounded-xl shadow-md border border-stone-200 self-start sticky top-6 z-50">
        <h2 class="text-2xl font-bold mb-4 wedding-title text-stone-800">Lista beállítások</h2>

        <div class="mb-4">
            <label class="block text-sm font-semibold mb-2 text-stone-600">Épület neve (Főcím)</label>
            <input type="text" id="buildingTitle" value="Borostyán Ház" class="w-full border border-stone-300 p-2 rounded focus:outline-none focus:ring-2 focus:ring-[#D4AF37] font-sans">
        </div>

        <div class="mb-4">
            <label class="block text-sm font-semibold mb-2 text-stone-600">Alcím</label>
            <input type="text" id="subTitle" value="Szállásbeosztás" class="w-full border border-stone-300 p-2 rounded focus:outline-none focus:ring-2 focus:ring-[#D4AF37] font-sans">
        </div>

        <div class="mb-4 bg-stone-50 p-3 rounded-lg border border-stone-200">
            <h3 class="text-sm font-bold text-stone-700 mb-3 font-sans uppercase tracking-wider">Betűméretek</h3>
            
            <div class="mb-3">
                <div class="flex justify-between text-xs font-semibold text-stone-600 mb-1 font-sans">
                    <label for="titleSize">Cím</label>
                    <span id="titleSizeVal">40 px</span>
                </div>
                <input type="range" id="titleSize" min="28" max="60" value="40" class="w-full accent-[#D4AF37] cursor-pointer">
            </div>

            <div>
                <div class="flex justify-between text-xs font-semibold text-stone-600 mb-1 font-sans">
                    <label for="textSize">Vendégek</label>
                    <span id="textSizeVal">20 px</span>
                </div>
                <input type="range" id="textSize" min="14" max="28" value="20" class="w-full accent-[#D4AF37] cursor-pointer">
            </div>
        </div>

        <div class="mb-6">
            <label class="block text-sm font-semibold mb-2 text-stone-600">Vendégek (Név; Szoba; <span class="text-[#D4AF37]">Titkos ID</span>)</label>
            <textarea id="guestList" rows="12" class="w-full border border-stone-300 p-2 rounded text-sm focus:outline-none focus:ring-2 focus:ring-[#D4AF37] font-sans" placeholder="Kovács János; Családi szoba; 1"></textarea>
            <p class="text-[10px] text-stone-500 mt-2 font-sans italic">Tipp: Ha több ugyanolyan nevű szoba van, tegyél a végükre egy azonosítót (pl. <strong>; 1</strong> és <strong>; 2</strong>). A gép ez alapján bontja külön őket, de a számot nem nyomtatja ki!</p>
        </div>

        <button onclick="window.print()" class="w-full bg-[#D4AF37] hover:bg-[#C5A028] text-white font-bold py-3 px-4 rounded-lg transition duration-200 font-sans tracking-wide shadow-sm flex items-center justify-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" /></svg>
            Nyomtatás / PDF
        </button>
    </div>

    <div id="pagesContainer" class="flex-1"></div>

    <script>
        const inputTitle = document.getElementById('buildingTitle');
        const inputSubTitle = document.getElementById('subTitle');
        const guestList = document.getElementById('guestList');
        const titleSizeSlider = document.getElementById('titleSize');
        const textSizeSlider = document.getElementById('textSize');
        const titleSizeVal = document.getElementById('titleSizeVal');
        const textSizeVal = document.getElementById('textSizeVal');
        const pagesContainer = document.getElementById('pagesContainer');

        const ROWS_PER_PAGE = 15;

        function updateView() {
            const title = inputTitle.value;
            const subTitle = inputSubTitle.value;
            const tSize = titleSizeSlider.value;
            const nSize = textSizeSlider.value;

            titleSizeVal.textContent = tSize + ' px';
            textSizeVal.textContent = nSize + ' px';

            const lines = guestList.value.split('\n').filter(line => line.trim() !== '');
            
            // MÓDOSÍTÁS: 3. paraméter (groupId) feldolgozása
            const guests = lines.map((line, index) => {
                const parts = line.split(';');
                const name = parts[0]?.trim() || '';
                const room = parts[1]?.trim() || '';
                // Ha van 3. paraméter, az lesz az ID. Ha nincs, akkor a szoba neve. Ha szoba sincs, generálunk egyedit.
                const groupId = parts[2]?.trim() || (room !== '' ? room : `unique-${index}`);
                return { name, room, groupId };
            });

            pagesContainer.innerHTML = '';
            const totalPages = Math.max(1, Math.ceil(guests.length / ROWS_PER_PAGE));

            for (let p = 0; p < totalPages; p++) {
                const pageDiv = document.createElement('div');
                pageDiv.className = 'print-page';

                pageDiv.innerHTML = `
                    <div class="absolute top-[12mm] left-[12mm] right-[12mm] bottom-[12mm] border border-[#D4AF37] opacity-40 pointer-events-none rounded-sm"></div>
                    <div class="absolute top-[14mm] left-[14mm] right-[14mm] bottom-[14mm] border-2 border-[#D4AF37] pointer-events-none rounded-sm"></div>
                    
                    <div class="text-center mb-8 relative z-10">
                        <h1 class="font-bold mb-2 wedding-title text-stone-800 tracking-wide" style="font-size: ${tSize}px; line-height: 1.2;">${title}</h1>
                        <p class="italic text-stone-500 font-serif tracking-wide" style="font-size: ${Math.max(16, tSize * 0.45)}px;">${subTitle}</p>
                        <div class="h-px bg-[#D4AF37] w-24 mx-auto mt-4"></div>
                    </div>

                    <div class="relative z-10 px-4">
                        <table class="w-full table-fixed text-left border-collapse">
                            <thead>
                                <tr class="border-b-2 border-[#D4AF37] text-stone-400 uppercase tracking-widest text-xs font-sans h-[10mm]">
                                    <th class="w-[10%] font-semibold pl-4">#</th>
                                    <th class="w-[55%] font-semibold">Vendég neve</th>
                                    <th class="w-[35%] font-semibold text-right pr-8">Szoba / Helyszín</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                    <!--
                    <div class="absolute bottom-[18mm] left-0 right-0 text-center text-xs text-stone-400 font-sans tracking-widest uppercase">
                        ${p + 1} / ${totalPages} oldal
                    </div>
                    -->
                `;

                const tbody = pageDiv.querySelector('tbody');
                let skipRoomCells = 0; 

                for (let r = 0; r < ROWS_PER_PAGE; r++) {
                    const guestIndex = (p * ROWS_PER_PAGE) + r;
                    const guest = guests[guestIndex];
                    
                    const tr = document.createElement('tr');
                    
                    if (guest) {
                        // MÓDOSÍTÁS: Szoba név helyett groupId alapján nézzük a csoport végét
                        let isLastInGroup = false;
                        if (r === ROWS_PER_PAGE - 1) {
                            isLastInGroup = true;
                        } else {
                            let nextGuest = guests[guestIndex + 1];
                            if (!nextGuest || nextGuest.groupId !== guest.groupId || guest.groupId === '') {
                                isLastInGroup = true;
                            }
                        }

                        if (isLastInGroup) {
                            tr.className = "h-[13mm] border-b border-stone-200";
                        } else {
                            tr.className = "h-[13mm]";
                        }

                        let roomCellHtml = '';

                        if (skipRoomCells === 0) {
                            let rowspan = 1;
                            
                            // MÓDOSÍTÁS: Szoba név helyett groupId alapján számoljuk a csoport méretét
                            for (let next = r + 1; next < ROWS_PER_PAGE; next++) {
                                let nextGuest = guests[(p * ROWS_PER_PAGE) + next];
                                if (nextGuest && nextGuest.groupId === guest.groupId && guest.groupId !== '') {
                                    rowspan++;
                                } else {
                                    break;
                                }
                            }
                            
                            if (rowspan > 1) {
                                skipRoomCells = rowspan - 1;
                            }
                            
                            // A megjelenített szöveg továbbra is a .room (a titkos ID nem látszik)
                            roomCellHtml = `
                                <td rowspan="${rowspan}" class="text-right align-middle pr-8">
                                    <span class="inline-block px-4 py-1.5 rounded-full border border-[#D4AF37] border-opacity-50 text-stone-600 bg-white" style="font-size: ${Math.max(14, nSize * 0.85)}px; font-style: italic;">
                                        ${guest.room}
                                    </span>
                                </td>`;
                        } else {
                            skipRoomCells--;
                        }

                        tr.innerHTML = `
                            <td class="text-stone-400 font-medium font-sans pl-4 align-middle" style="font-size: ${Math.max(13, nSize * 0.75)}px;">${guestIndex + 1}.</td>
                            <td class="font-semibold text-stone-800 truncate pr-4 align-middle" style="font-size: ${nSize}px;">${guest.name}</td>
                            ${roomCellHtml}
                        `;
                    } else {
                        tr.className = "h-[13mm]";
                        tr.innerHTML = `
                            <td class="text-transparent font-sans pl-4 align-middle" style="font-size: ${nSize}px;">${guestIndex + 1}.</td>
                            <td>&nbsp;</td>
                            <td class="pr-8">&nbsp;</td>
                        `;
                    }
                    tbody.appendChild(tr);
                }
                pagesContainer.appendChild(pageDiv);
            }
        }

        inputTitle.addEventListener('input', updateView);
        inputSubTitle.addEventListener('input', updateView);
        guestList.addEventListener('input', updateView);
        titleSizeSlider.addEventListener('input', updateView);
        textSizeSlider.addEventListener('input', updateView);

        // Mintaadatok
        guestList.value = "Kovács János; Családi 3 fős szoba; 1\nKovácsné Erzsébet; Családi 3 fős szoba; 1\nKovács Petike; Családi 3 fős szoba; 1\nSzabó Anna; Családi 3 fős szoba; 2\nSzabó Gábor; Családi 3 fős szoba; 2\nSzabó Lili; Családi 3 fős szoba; 2\nKiss Boldizsár; Kétágyas szoba";
        updateView();
    </script>
</body>
</html>
